<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MiniMail â€“ Your Lightweight Inbox</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>
</head>
<body>

<!-- ===== LOGIN PAGE ===== -->
<div id="login-page" class="auth-page active">
  <div class="login-bg">
    <div class="login-blob b1"></div>
    <div class="login-blob b2"></div>
    <div class="login-blob b3"></div>
  </div>
  <div class="auth-card">
    <div class="auth-brand">
      <span class="material-icons brand-icon" style="font-size: 32px; color: var(--accent);">email</span>
      <h1>MiniMail</h1>
    </div>
    <p class="auth-sub">Sign in to your inbox</p>
    <div class="form-group">
      <label>Email address</label>
      <input type="email" id="login-email" placeholder="you@minimail.com" />
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="login-password" placeholder="********" />
    </div>
    <p class="auth-switch">Use any email + password to sign in (demo)</p>
    <button class="btn-primary" onclick="handleLogin()">Sign In</button>
    <div class="divider"><span>or</span></div>
    <button class="btn-ghost" onclick="handleLogin()">Continue as Guest</button>
  </div>
</div>

<!-- ===== MAIN APP ===== -->
<div id="app-page" class="app-page">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <span class="brand-icon-sm">âœ‰</span>
      <span class="brand-name">MiniMail</span>
      <button class="sidebar-close" onclick="toggleSidebar()"><span class="material-icons">close</span></button>
    </div>

    <button class="compose-btn" onclick="openCompose()">
      <span class="material-icons">edit</span>
      Compose
    </button>

    <nav class="sidebar-nav">
      <a class="nav-item active" onclick="showFolder('inbox')" data-folder="inbox">
        <span class="material-icons">inbox</span> Inbox
        <span class="badge" id="inbox-badge">3</span>
      </a>
      <a class="nav-item" onclick="showFolder('starred')" data-folder="starred">
        <span class="material-icons">star</span> Starred
      </a>
      <a class="nav-item" onclick="showFolder('sent')" data-folder="sent">
        <span class="material-icons">send</span> Sent
      </a>
      <a class="nav-item" onclick="showFolder('drafts')" data-folder="drafts">
        <span class="material-icons">drafts</span> Drafts
        <span class="badge draft-badge" id="draft-badge">1</span>
      </a>
      <a class="nav-item" onclick="showFolder('trash')" data-folder="trash">
        <span class="material-icons">delete</span> Trash
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="storage-bar">
        <div class="storage-fill" style="width:34%"></div>
      </div>
      <p class="storage-text">3.4 GB of 15 GB used</p>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main-content">

    <!-- TOP BAR -->
    <header class="topbar">
      <button class="icon-btn" onclick="toggleSidebar()"><span class="material-icons">menu</span></button>
      <div class="search-bar">
        <span class="material-icons search-icon">search</span>
        <input type="text" id="search-input"  oninput="searchMail(this.value)"/>
        <button class="icon-btn" onclick="clearSearch()"><span class="material-icons">close</span></button>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" title="Refresh" onclick="refreshInbox()"><span class="material-icons">refresh</span></button>
        <button class="icon-btn" title="Settings" onclick="toggleSettings()"><span class="material-icons">settings</span></button>
        <div class="avatar" onclick="handleLogout()" title="Sign out">
          <span id="avatar-letter">U</span>
        </div>
      </div>
    </header>

    <!-- EMAIL LIST VIEW -->
    <section id="email-list-view">
      <div class="list-toolbar">
        <div class="toolbar-left">
          <input type="checkbox" id="select-all" onchange="toggleSelectAll(this)" />
          <button class="icon-btn" title="Delete selected" onclick="deleteSelected()"><span class="material-icons">delete</span></button>
          <button class="icon-btn" title="Mark as read" onclick="markSelectedRead()"><span class="material-icons">mark_email_read</span></button>
        </div>
        <div class="folder-title" id="folder-title">Inbox</div>
        <div class="toolbar-right">
          <span id="email-count" class="email-count">1â€“20 of 20</span>
          <button class="icon-btn"><span class="material-icons">chevron_left</span></button>
          <button class="icon-btn"><span class="material-icons">chevron_right</span></button>
        </div>
      </div>

      <div id="email-list" class="email-list"></div>
    </section>

    <!-- EMAIL DETAIL VIEW -->
    <section id="email-detail-view" class="hidden">
      <div class="detail-toolbar">
        <button class="icon-btn" onclick="closeDetail()"><span class="material-icons">arrow_back</span></button>
        <button class="icon-btn" title="Delete" onclick="deleteCurrentEmail()"><span class="material-icons">delete</span></button>
        <button class="icon-btn" title="Mark unread" onclick="markCurrentUnread()"><span class="material-icons">mark_email_unread</span></button>
        <button class="icon-btn" title="Star" onclick="starCurrentEmail()" id="detail-star-btn"><span class="material-icons">star_border</span></button>
      </div>
      <div class="email-detail-body">
        <h2 id="detail-subject"></h2>
        <div class="detail-meta">
          <div class="detail-avatar" id="detail-avatar"></div>
          <div>
            <div class="detail-from" id="detail-from"></div>
            <div class="detail-date" id="detail-date"></div>
          </div>
        </div>
        <div class="detail-content" id="detail-content"></div>
        <div class="reply-box">
          <h4>Reply</h4>
          <textarea id="reply-input" ></textarea>
          <button class="btn-primary small" onclick="sendReply()">Send Reply</button>
        </div>
      </div>
    </section>

  </main>
</div>

<!-- ===== COMPOSE MODAL ===== -->
<div id="compose-modal" class="modal-overlay hidden">
  <div class="compose-window">
    <div class="compose-header">
      <span>New Message</span>
      <div>
        <button class="icon-btn" onclick="minimizeCompose()" title="Minimize"><span class="material-icons">remove</span></button>
        <button class="icon-btn" onclick="closeCompose()" title="Close"><span class="material-icons">close</span></button>
      </div>
    </div>
    <div class="compose-body">
      <input type="email" id="compose-to"  />
      <input type="email" id="compose-cc"  />
      <input type="text" id="compose-subject"  />
      <textarea id="compose-body" ></textarea>
    </div>
    <div class="compose-footer">
      <button class="btn-primary small" onclick="sendEmail()">
        <span class="material-icons" style="font-size:16px;vertical-align:middle">send</span>
        Send
      </button>
      <button class="btn-ghost small" onclick="saveDraft()">Save Draft</button>
      <button class="icon-btn" onclick="closeCompose()"><span class="material-icons">delete</span></button>
    </div>
  </div>
</div>

<!-- ===== SETTINGS PANEL ===== -->
<div id="settings-panel" class="settings-panel hidden">
  <div class="settings-header">
    <h3>Settings</h3>
    <button class="icon-btn" onclick="toggleSettings()"><span class="material-icons">close</span></button>
  </div>
  <div class="settings-body">
    <label class="setting-row">
      <span>Dark Mode</span>
      <input type="checkbox" id="dark-mode-toggle" onchange="toggleDarkMode(this)" />
    </label>
    <label class="setting-row">
      <span>Compact View</span>
      <input type="checkbox" id="compact-toggle" onchange="toggleCompact(this)" />
    </label>
    <div class="setting-row">
      <span>Theme Color</span>
      <div class="theme-swatches">
        <div class="swatch" style="background:#4f46e5" onclick="setTheme('#4f46e5')"></div>
        <div class="swatch" style="background:#0ea5e9" onclick="setTheme('#0ea5e9')"></div>
        <div class="swatch" style="background:#10b981" onclick="setTheme('#10b981')"></div>
        <div class="swatch" style="background:#f97316" onclick="setTheme('#f97316')"></div>
        <div class="swatch" style="background:#e11d48" onclick="setTheme('#e11d48')"></div>
      </div>
    </div>
    <button class="btn-ghost small full-width" style="margin-top:16px" onclick="handleLogout()">Sign Out</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast hidden"></div>

<script src="storage.js"></script>
<script src="auth.js"></script>
<script src="mail.js"></script>
<script src="app.js"></script>
</body>
</html>
